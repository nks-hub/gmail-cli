version: 2
updates:
  # bun keeps bun.lock in step; the npm ecosystem only edits package.json,
  # which then fails `bun install --frozen-lockfile` in CI.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
